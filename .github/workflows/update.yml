name: AKASH OTT Auto Playlist

on:
  workflow_dispatch:

  schedule:
    - cron: "*/58 * * * *"

permissions:
  contents: write

concurrency:
  group: akash-ott-playlist
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Requirements
        run: |
          python -m pip install --disable-pip-version-check requests==2.32.5

      - name: Generate Playlist
        env:
          AKASH_RAIL_API: ${{ secrets.AKASH_RAIL_API }}
          AKASH_DETAIL_API_TEMPLATE: ${{ secrets.AKASH_DETAIL_API_TEMPLATE }}
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python src/main.py

      - name: Verify Output
        run: |
          if [ ! -f kb_go_playlist.m3u8 ]; then
            echo "ERROR: Playlist file was not generated!"
            exit 1
          fi

          echo "Playlist file exists."
          echo "File size:"
          wc -c kb_go_playlist.m3u8

          echo "First lines:"
          head -n 12 kb_go_playlist.m3u8

      - name: Commit Playlist
        run: |
          git config user.name "AKASH OTT BOT"
          git config user.email "actions@github.com"

          git add kb_go_playlist.m3u8 state/last_update.txt

          git diff --cached --quiet || git commit -m "Update AKASH OTT Playlist"

          git push
