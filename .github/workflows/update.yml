name: AKASH OTT Playlist Update

on:
  workflow_dispatch:
  schedule:
    - cron: "*/55 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Generate playlist
        env:
          AKASH_RAIL_API: ${{ secrets.AKASH_RAIL_API }}
          AKASH_DETAIL_API_TEMPLATE: ${{ secrets.AKASH_DETAIL_API_TEMPLATE }}
        run: python src/main.py

      - name: Commit playlist
        run: |
          git config user.name "AKASH OTT BOT"
          git config user.email "actions@github.com"
          git add kb_go_playlist.m3u8 state/last_update.txt
          git diff --cached --quiet || git commit -m "Update AKASH OTT playlist"
          git push
