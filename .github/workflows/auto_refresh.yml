name: BD FreeOTT Auto Generator

on:

  workflow_dispatch:

  schedule:
    # Every 90 minutes (UTC)
    - cron: "0 0-21/3 * * *"
    - cron: "30 1-22/3 * * *"

permissions:
  contents: write

concurrency:
  group: freeott-playlist
  cancel-in-progress: false

jobs:

  generate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate Playlist
        env:
          OTT_API_URL: ${{ secrets.OTT_API_URL }}
        run: |
          python playlist_maker.py

      - name: Commit Playlist
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add BDFreechannel/Freeott.m3u8

          if ! git diff --cached --quiet; then

            git commit -m "Auto Update FreeOTT Playlist"

            git push

          else

            echo "No changes detected."

          fi
